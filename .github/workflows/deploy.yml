name: CI and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled; deploys never are.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Own lockfile and deps; does not gate the Pages deploy. worker-deploy ships it after this passes.
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Generated decoder must match proto/subway-rt.proto.
      - run: |
          npm run gen
          git diff --exit-code -- src/gen
          test -z "$(git status --porcelain -- src/gen)"

  # Deploys the realtime Worker on every push to main (wrangler deploy is idempotent).
  # Needs repo secrets CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID.
  worker-deploy:
    if: github.event_name != 'pull_request'
    needs: worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip until the Cloudflare secrets are set
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the Worker deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler deploy

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # Size of the basemap in the artifact; empty while data/basemap/basemap.json has no pin.
      basemap_bytes: ${{ steps.basemap.outputs.bytes }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Includes tsc -b, so type errors fail the build.
      - run: npm run build
        env:
          # Repo variable: the deployed Worker's /rt URL. Unset builds the "Live trains off" site.
          VITE_RT_URL: ${{ vars.VITE_RT_URL }}
      # The NYC basemap is never in git: basemap.yml publishes it as a release asset, and the pin in
      # data/basemap/basemap.json names it. Copied in after the build (vite empties dist), sha256-checked, and
      # fetched by the browser only on demand.
      - name: Add the basemap
        id: basemap
        run: |
          if [ "$(jq '.pin' data/basemap/basemap.json)" = null ]; then
            echo "::warning::data/basemap/basemap.json has no pin; deploying without the basemap."
            echo "bytes=" >> "$GITHUB_OUTPUT"
          else
            node scripts/fetch-basemap.ts --out dist/basemap/nyc.pmtiles
            echo "bytes=$(jq '.pin.bytes' data/basemap/basemap.json)" >> "$GITHUB_OUTPUT"
          fi
      # GitHub Pages sites are limited to 1 GB.
      - name: Check the artifact size
        run: |
          size=$(du -sb dist | cut -f1)
          echo "The Pages artifact is $size bytes." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt 900000000 ]; then
            echo "::error::dist is $size bytes, over the 900 MB cap"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Measures Range on the live site once the basemap is deployed (skipped while there is no pin): the
  # PMTiles client reads the archive in ranges, so the site must answer a correct uncompressed 206.
  verify-basemap:
    needs: [build, deploy]
    if: needs.build.outputs.basemap_bytes != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          BYTES: ${{ needs.build.outputs.basemap_bytes }}
        run: node scripts/verify-basemap.ts "${PAGE_URL%/}/basemap/nyc.pmtiles" "$BYTES"
