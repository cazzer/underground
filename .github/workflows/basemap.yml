name: Build the NYC basemap

# Cuts the NYC basemap out of a Protomaps daily build and publishes it as a GitHub Release asset, which
# deploy.yml then unpacks into the Pages artifact (the daily builds expire after about a week, and Protomaps asks
# not to hotlink them). Manual only: run it when the basemap should change, then pin the release in a normal PR.
#
# The site serves the tiles as static files, tiles/<z>/<x>/<y>.mvt, each gzip-compressed on disk (`gzip -n -9`, still
# named .mvt): GitHub Pages adds no content-encoding to that type, so the tiles go over the wire exactly as stored and the
# client's worker inflates them (src/lib/basemap/inflate.ts). A single .pmtiles read in Range requests fails when Pages
# gzips a range, with a wrong content-range total (measured in deploy run 44989770200, docs/research/data-sources.md). The
# one release asset is a tarball of that directory, nyc-tiles.tar.gz.
#
#   generate  read-only; extracts the bbox and zoom range with go-pmtiles, checks the source metadata against the
#             reviewed licence terms (scripts/gate-basemap.ts), drops the layers the site doesn't use with
#             tippecanoe's tile-join, verifies the result and its size, writes it as a tile directory (tile-join -e),
#             checks every tile, packs a deterministic tarball, unpacks it again with the deploy's own extractor and
#             compares, uploads it as an artifact
#   publish   write token; never runs npm or repo code; creates the release (tag basemap-<build>-<sha8>) and prints
#             the pin to put in data/basemap/basemap.json
#
# The pin is updated by a normal PR, so CI runs on it; this workflow never opens one.
on:
  workflow_dispatch:
    inputs:
      build:
        description: 'Protomaps daily build, YYYYMMDD (blank: yesterday UTC). Builds are kept for about a week.'
        required: false
        type: string

permissions:
  contents: read

# Explicit bash so every run step gets -eo pipefail.
defaults:
  run:
    shell: bash

concurrency:
  group: basemap
  cancel-in-progress: false

env:
  GO_PMTILES_VERSION: 1.31.2
  GO_PMTILES_SHA256: 3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f
  TIPPECANOE_TAG: 2.79.0
  TIPPECANOE_COMMIT: 68ab8dcc229f95b8b25877697d5e8d66783af503
  # The deployed tiles must stay far below the 1 GB Pages limit; the NYC subset measured about 33 MB as a .pmtiles and
  # 45 MB as 3,820 uncompressed tile files at z15 (the tarball 31 MB); gzipped the tile files are about two thirds of that.
  BASEMAP_MAX_BYTES: 200000000

jobs:
  generate:
    timeout-minutes: 60
    # Only on the default branch (a dispatch from another branch does nothing).
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.build.outputs.build }}
      basemap_version: ${{ steps.gate.outputs.basemap_version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      bytes: ${{ steps.pack.outputs.bytes }}
      files: ${{ steps.pack.outputs.files }}
      tile_bytes: ${{ steps.pack.outputs.tile_bytes }}
      inflated_bytes: ${{ steps.pack.outputs.inflated_bytes }}
      layers: ${{ steps.build.outputs.layers }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Node only runs the repo's own dependency-free scripts (the gate); there is no npm install here.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Choose the build
        id: build
        env:
          INPUT_BUILD: ${{ inputs.build }}
        run: |
          build="${INPUT_BUILD:-$(date -u -d yesterday +%Y%m%d)}"
          if ! [[ "$build" =~ ^[0-9]{8}$ ]]; then
            echo "::error::build must be YYYYMMDD, got '$build'"
            exit 1
          fi
          status=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' -I "https://build.protomaps.com/${build}.pmtiles")
          if [ "$status" != 200 ]; then
            echo "::error::https://build.protomaps.com/${build}.pmtiles answered HTTP ${status}; daily builds are kept for about a week, pick a recent one"
            exit 1
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "layers=$(jq -r '.spec.layers | join(", ")' data/basemap/basemap.json)" >> "$GITHUB_OUTPUT"

      - name: Install go-pmtiles ${{ env.GO_PMTILES_VERSION }}
        run: |
          curl -fsSL -o go-pmtiles.tar.gz "https://github.com/protomaps/go-pmtiles/releases/download/v${GO_PMTILES_VERSION}/go-pmtiles_${GO_PMTILES_VERSION}_Linux_x86_64.tar.gz"
          echo "${GO_PMTILES_SHA256}  go-pmtiles.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/bin"
          tar -xzf go-pmtiles.tar.gz -C "$HOME/bin" pmtiles
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # tile-join is the one tool that drops whole layers from a .pmtiles without a writer of our own. Pinned to a
      # tag and its commit (a moved tag fails the build), built here only, never in the deploy.
      - name: Build tippecanoe's tile-join ${{ env.TIPPECANOE_TAG }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev zlib1g-dev
          git clone --quiet --depth 1 --branch "$TIPPECANOE_TAG" https://github.com/felt/tippecanoe "$RUNNER_TEMP/tippecanoe"
          test "$(git -C "$RUNNER_TEMP/tippecanoe" rev-parse HEAD)" = "$TIPPECANOE_COMMIT"
          make -C "$RUNNER_TEMP/tippecanoe" -j"$(nproc)" tile-join
          echo "$RUNNER_TEMP/tippecanoe" >> "$GITHUB_PATH"

      - name: Extract the bbox from the daily build
        env:
          BUILD: ${{ steps.build.outputs.build }}
        run: |
          bbox=$(jq -r '.spec.bbox | map(tostring) | join(",")' data/basemap/basemap.json)
          maxzoom=$(jq -r '.spec.maxzoom' data/basemap/basemap.json)
          pmtiles extract "https://build.protomaps.com/${BUILD}.pmtiles" full.pmtiles --bbox="$bbox" --maxzoom="$maxzoom"
          pmtiles show full.pmtiles
          ls -l full.pmtiles

      # Fails the run when the metadata names anything the footer's OpenStreetMap credit doesn't cover; the finding
      # then goes to a person as a licensing card.
      - name: Check the source's credits and layers
        id: gate
        run: |
          pmtiles show full.pmtiles --metadata > source-metadata.json
          node scripts/gate-basemap.ts source source-metadata.json
          echo "basemap_version=$(jq -r .version source-metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Drop the layers the site doesn't use
        run: |
          args=()
          for layer in $(jq -r '.spec.layers[]' data/basemap/basemap.json); do args+=(-l "$layer"); done
          # -pk: keep tiles over 500 KB; -pg: no tilestats (not needed, and it would grow the metadata).
          tile-join -f -pk -pg -o nyc.pmtiles "${args[@]}" full.pmtiles
          pmtiles verify nyc.pmtiles
          pmtiles show nyc.pmtiles
          pmtiles show nyc.pmtiles --metadata > output-metadata.json
          node scripts/gate-basemap.ts output output-metadata.json

      - name: Check the size and report it per zoom
        env:
          BUILD: ${{ steps.build.outputs.build }}
          BASEMAP_VERSION: ${{ steps.gate.outputs.basemap_version }}
        run: |
          bytes=$(stat -c %s nyc.pmtiles)
          if [ "$bytes" -gt "$BASEMAP_MAX_BYTES" ]; then
            echo "::error::nyc.pmtiles is $bytes bytes, over the $BASEMAP_MAX_BYTES cap"
            exit 1
          fi
          # The tile bytes per zoom, read back through mbtiles (sqlite3 is on the runner).
          for name in full nyc; do
            tile-join -f -pk -pg -o "$name.mbtiles" "$name.pmtiles" > /dev/null
          done
          {
            echo "### Basemap size"
            echo "Source build ${BUILD}, basemap ${BASEMAP_VERSION}. Subset: $bytes bytes (full extract $(stat -c %s full.pmtiles))."
            echo
            echo '| Zoom | Tiles | Full extract bytes | Subset bytes |'
            echo '|---|---|---|---|'
            sqlite3 :memory: "attach 'full.mbtiles' as f; attach 'nyc.mbtiles' as n;
              select a.z, a.c, a.b, s.b
              from (select zoom_level z, count(*) c, sum(length(tile_data)) b from f.tiles group by 1) a
              join (select zoom_level z, sum(length(tile_data)) b from n.tiles group by 1) s on s.z = a.z
              order by a.z;" | awk -F'|' '{ printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4 }'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # tile-join -e writes one tile per file, -pC uncompressed so that the compression below is ours and fixed (Pages adds
      # no content-encoding to a .mvt, so the stored bytes are the wire bytes); it names them <z>/<x>/<y>.pbf and adds a
      # metadata.json, which the gate already read and the client doesn't need, so neither ships: the tiles are renamed
      # .mvt, each is gzipped in place (`gzip -n -9`: no name, no time, so the bytes depend on the content alone; the file
      # keeps its .mvt name, the client sniffs 1f 8b) and the tree is checked before anything is packed
      # (scripts/basemap-tiles.ts check --gzip: every file gzip, an MVT once inflated, named on its zoom's grid, zoom within
      # the spec's maxzoom). The tile bytes in the report and the pin are the stored, compressed sizes; the inflated total
      # is reported next to them, and the probe tiles' two sizes are appended to the report.
      - name: Write the tile directory
        id: tiles
        run: |
          rm -rf raw stage
          mkdir stage
          tile-join -f -pk -pg -pC -e raw nyc.pmtiles
          test -f raw/metadata.json
          mv raw stage/tiles
          rm stage/tiles/metadata.json
          find stage/tiles -name '*.pbf' | while IFS= read -r f; do mv "$f" "${f%.pbf}.mvt"; done
          # sh -e so a failed gzip stops its batch (a loop's status is its last command's); xargs then exits non-zero.
          # The list is written first (outside stage/) so gzip's temp files never join it and a failed find stops the step.
          find stage/tiles -type f -name '*.mvt' -print0 > mvt-list.bin
          test -s mvt-list.bin
          # shellcheck disable=SC2016  # the single quotes are on purpose: the inner sh expands $f
          xargs -0 -n 64 -P "$(nproc)" sh -ec 'for f; do gzip -n -9 -c "$f" > "$f.tmp"; mv "$f.tmp" "$f"; done' sh < mvt-list.bin
          maxzoom=$(jq -r '.spec.maxzoom' data/basemap/basemap.json)
          node scripts/basemap-tiles.ts check stage/tiles --gzip --max-zoom "$maxzoom" | tee tiles-report.txt
          node scripts/basemap-tiles.ts probe-sizes stage/tiles 2>&1 | tee -a tiles-report.txt

      # Deterministic, so the same tiles give the same sha256: sorted names, files only (no directory entries), mtime 0,
      # owner 0, fixed modes, ustar (what the deploy's reader accepts), gzip without a name or time. The round trip uses
      # the deploy's extractor (scripts/basemap-tiles.ts unpack), so a tarball it would refuse fails here.
      - name: Pack the tiles
        id: pack
        env:
          # From `basemap-tiles.ts check`, which wrote them to this step's outputs.
          files: ${{ steps.tiles.outputs.files }}
          tile_bytes: ${{ steps.tiles.outputs.tile_bytes }}
          inflated_bytes: ${{ steps.tiles.outputs.inflated_bytes }}
          encoding: ${{ steps.tiles.outputs.encoding }}
        run: |
          [[ "$files" =~ ^[0-9]+$ && "$tile_bytes" =~ ^[0-9]+$ && "$inflated_bytes" =~ ^[0-9]+$ ]] || { echo "::error::the tile check reported no counts (files '$files', bytes '$tile_bytes', inflated '$inflated_bytes')"; exit 1; }
          test "$encoding" = gzip || { echo "::error::the tile check says the tiles are '$encoding', not gzip"; exit 1; }
          if [ "$inflated_bytes" -gt "$BASEMAP_MAX_BYTES" ]; then
            echo "::error::the tiles inflate to $inflated_bytes bytes, over the $BASEMAP_MAX_BYTES cap"
            exit 1
          fi
          (cd stage && find tiles -type f | LC_ALL=C sort) > "$PWD/files.txt"
          test "$(wc -l < files.txt | tr -d ' ')" = "$files"
          tar --format=ustar --numeric-owner --owner=0 --group=0 --mtime=@0 --mode='u=rw,go=r' -C stage -T "$PWD/files.txt" -cf - | gzip -9n > nyc-tiles.tar.gz
          bytes=$(stat -c %s nyc-tiles.tar.gz)
          if [ "$bytes" -gt "$BASEMAP_MAX_BYTES" ]; then
            echo "::error::nyc-tiles.tar.gz is $bytes bytes, over the $BASEMAP_MAX_BYTES cap"
            exit 1
          fi
          rm -rf unpacked
          start=$(date +%s.%N)
          node scripts/basemap-tiles.ts unpack nyc-tiles.tar.gz unpacked --files "$files" --tile-bytes "$tile_bytes" --gzip --max-zoom "$(jq -r '.spec.maxzoom' data/basemap/basemap.json)"
          secs=$(awk -v a="$start" -v b="$(date +%s.%N)" 'BEGIN { printf "%.1f", b - a }')
          diff -r stage/tiles unpacked/tiles
          sha256=$(sha256sum nyc-tiles.tar.gz | cut -d' ' -f1)
          {
            echo "### Tile tarball"
            echo "${files} gzip-compressed tile files, ${tile_bytes} bytes stored (${inflated_bytes} inflated); nyc-tiles.tar.gz ${bytes} bytes, sha256 \`${sha256}\`. The deploy's extractor unpacked it in ${secs} s and it matches the directory."
            echo
            echo '```'
            cat tiles-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "sha256=$sha256"
            echo "bytes=$bytes"
            echo "files=$files"
            echo "tile_bytes=$tile_bytes"
            echo "inflated_bytes=$inflated_bytes"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: basemap
          path: |
            nyc-tiles.tar.gz
            source-metadata.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD: ${{ needs.generate.outputs.build }}
      BASEMAP_VERSION: ${{ needs.generate.outputs.basemap_version }}
      SHA256: ${{ needs.generate.outputs.sha256 }}
      BYTES: ${{ needs.generate.outputs.bytes }}
      FILES: ${{ needs.generate.outputs.files }}
      TILE_BYTES: ${{ needs.generate.outputs.tile_bytes }}
      INFLATED_BYTES: ${{ needs.generate.outputs.inflated_bytes }}
      LAYERS: ${{ needs.generate.outputs.layers }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: basemap

      - name: Check what was uploaded
        run: |
          test "$(sha256sum nyc-tiles.tar.gz | cut -d' ' -f1)" = "$SHA256"
          test "$(stat -c %s nyc-tiles.tar.gz)" = "$BYTES"

      - name: Create the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="basemap-${BUILD}-${SHA256:0:8}"
          cat > notes.md <<EOF
          NYC basemap tiles for the underground map: the Protomaps basemap build ${BUILD} (basemap ${BASEMAP_VERSION}),
          cut to the five boroughs, zoom 0 to 15, with only the ${LAYERS} layers.

          - Asset: \`nyc-tiles.tar.gz\`, a tarball of ${FILES} gzip-compressed Mapbox Vector Tiles at \`tiles/<z>/<x>/<y>.mvt\`
            (each gzipped with \`gzip -n -9\`, still named .mvt; ${TILE_BYTES} bytes unpacked, ${INFLATED_BYTES} bytes inflated),
            cut from a PMTiles extract by tippecanoe's tile-join (\`-e -pC\`); the site serves them as static files, and the
            client inflates them
          - Source: https://build.protomaps.com/${BUILD}.pmtiles (https://docs.protomaps.com/basemaps/downloads)
          - sha256: \`${SHA256}\`, ${BYTES} bytes (the tarball)
          - Pin: \`data/basemap/basemap.json\`; built by the \`basemap\` workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Licence and credits: © OpenStreetMap contributors, available under the Open Database License 1.0
          (https://opendatacommons.org/licenses/odbl/1-0/); these tiles are a derivative database under the ODbL.
          The earth and water layers also hold Natural Earth data at low zooms (public domain) and OSM-derived polygons
          (osmdata.openstreetmap.de, ODbL). The landcover layer (ESA WorldCover, CC BY 4.0), the places layer (minzoom values
          derived from Tilezen and Natural Earth) and the pois, buildings and boundaries layers are removed. The metadata's
          own attribution reads "© OpenStreetMap". Protomaps' terms: https://github.com/protomaps/basemaps/blob/main/LICENSE_DATA.md.
          EOF
          gh release create "$tag" nyc-tiles.tar.gz \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "NYC basemap ${BUILD}" --notes-file notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Print the pin
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          pin=$(jq -n --arg build "$BUILD" --arg v "$BASEMAP_VERSION" --arg release "$TAG" --arg sha "$SHA256" --argjson bytes "$BYTES" --argjson files "$FILES" --argjson tileBytes "$TILE_BYTES" \
            '{build: $build, basemapVersion: $v, release: $release, asset: "nyc-tiles.tar.gz", sha256: $sha, bytes: $bytes, files: $files, tileBytes: $tileBytes}')
          {
            echo "### Pin"
            echo "Release \`$TAG\` is published. Set \`pin\` in \`data/basemap/basemap.json\` to this, in a normal PR:"
            echo
            echo '```json'
            echo "$pin"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
